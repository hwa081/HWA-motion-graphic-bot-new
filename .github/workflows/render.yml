name: Make video

run-name: ${{ inputs.mode }} ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ai = AI plans + makes a video (compares itself with a reference video if you give one). code = Code Studio. compare = measure your video against an example (files: example.mp4,yours.mp4). remix = new design plan from old designs. study = teach it a technique (prompt = text or URL). evolve = build the most wanted missing effect. demo = test. feedback = rate. learn = study references. See README."
        type: choice
        default: demo
        options: [demo, ai, code, checks, compare, remix, study, evolve, export, lighten, native, design, designs-pdf, check, feedback, learn, assets-check, index-canva, qa, spec, reference]
      prompt:
        description: "ai: describe the video. feedback: what you liked / disliked. study: text or URL to learn from. remix: topic. compare: (optional) the brief"
        required: false
        default: ""
      duration:
        description: "ai: length in seconds (3 to 60; 61 to 600 = long video, made part by part and saved as it goes)"
        required: false
        default: "10"
      size:
        description: "ai: 16:9 landscape, 9:16 vertical (Shorts/Reels), 1:1 square"
        type: choice
        default: "16:9"
        options: ["16:9", "9:16", "1:1"]
      slot:
        description: "the page runs up to 2 videos together: slot 1 and slot 2 (each slot runs one at a time)"
        required: false
        default: "1"
        type: choice
        options: ["1", "2"]
      storyboard:
        description: "off | ask = design first and show ONE storyboard picture (no video yet) | approved = make the video from the approved design"
        required: false
        default: "off"
      speed:
        description: "fast = ready in a few minutes (1 AI request, no AI review) | quality = AI plans and reviews (slower)"
        required: false
        default: "fast"
        type: choice
        options: ["fast", "quality"]
      review:
        description: "ai: AI looks at a preview and improves it (uses more free quota)"
        type: boolean
        default: true
      files:
        description: "ai: images to animate and/or one reference video (comma separated). compare: example video, then your video or spec.json. study: optional .txt/.md file. learn: reference folder. spec/qa: JSON file path."
        required: false
        default: ""
      formats:
        description: "extra outputs next to the MP4: wfp (Filmora), fcpxml, xml, webm, poster, frames, mp4-light. Comma list, or all / none. Add nomp4 to get only the chosen files without the MP4"
        required: false
        default: "wfp,fcpxml,xml"
      sound:
        description: "ui = UI/SaaS animation sounds (click, toggle, notification, swipe, success), NO music. premium = soft, warm premium-app UI sounds (never harsh), NO music. viral = punchy short-form editor SFX (gravel hit, snapshot woosh, camera shutter, gone fast, airy slice, bass drop), NO music. kinetic = only typography sound effects, NO music (stamp, word click, typing ticks, whoosh). uplift/calm/tech = music + sound effects. none = silent video. If you give an audio file below, that is used instead."
        type: choice
        default: "premium"
        options: ["premium", "viral", "kinetic", "ui", "uplift", "calm", "tech", "none"]
      audio:
        description: "optional music/voice file already uploaded in the repo (e.g. assets/music.mp3); added under the video, video quality untouched"
        required: false
        default: ""
      media_dir:
        description: "Folder on YOUR PC where you will keep the MP4 (written inside the .wfp / .xml, e.g. C:/Users/HWA/Downloads/motion-bot)"
        required: false
        default: "C:/Users/HWA/Downloads/motion-bot"
      level:
        description: "lighten: 1 = safe repack, 2 = + lossless PNG, 3 = + smaller media-bin thumbnails (data identical, render unaffected)"
        type: choice
        default: "3"
        options: ["1", "2", "3"]
      rating:
        description: "feedback: your rating 1 (bad) to 5 (great)"
        type: choice
        default: "3"
        options: ["1", "2", "3", "4", "5"]
      ai:
        description: "which AI to use first: gemini, or the id of an AI you added in the Studio page (empty = the default AI). The others are used as backup."
        required: false
        default: ""
      job:
        description: "label used by the Studio page to find this run (leave empty when you start it by hand)"
        required: false
        default: ""
      project:
        description: "Studio page project id (only used to group results on the page)"
        required: false
        default: ""
      quality:
        description: "draft = fast small preview (half size, 15 fps; editor files are made when you press Final) | final = full quality"
        type: choice
        default: "final"
        options: ["final", "draft"]
      resume:
        description: "auto = continue unfinished work of the same brief (saved in the work/ folder) | off = start from zero"
        type: choice
        default: "auto"
        options: ["auto", "off"]
      parent:
        description: "Studio page: id of the draft this final video replaces"
        required: false
        default: ""
      design_id:
        description: "feedback: video id from report.md (empty = latest) | design: library design id like doc-01-title-hero (empty = list matches for the prompt)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: motion-bot-slot-${{ inputs.slot || '1' }}
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Get the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and emoji font
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && fc-list 2>/dev/null | grep -qi emoji && ldconfig -p | grep -q libcairo.so.2; then
            echo "ffmpeg, emoji font and cairo are already there"
          else
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji libcairo2
          fi

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Start the free local AI (when LOCAL_AI is "on" or this video asks for it)
        if: ${{ vars.LOCAL_AI == 'on' || inputs.ai == 'local' }}
        continue-on-error: true
        env:
          LOCAL_AI_MODEL_VAR: ${{ vars.LOCAL_AI_MODEL }}
        run: |
          MODEL="${LOCAL_AI_MODEL_VAR:-qwen3.5:4b}"
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fs http://127.0.0.1:11434/api/version >/dev/null; then
            OLLAMA_CONTEXT_LENGTH=16384 OLLAMA_KEEP_ALIVE=24h nohup ollama serve > ollama.log 2>&1 &
          fi
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:11434/api/version >/dev/null && break; sleep 2; done
          ollama pull "$MODEL"
          echo "LOCAL_AI=on" >> "$GITHUB_ENV"
          echo "LOCAL_AI_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "local AI ready: $MODEL"

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_REQUESTS: ${{ vars.MAX_REQUESTS }}
          LEARN_LIMIT: ${{ vars.LEARN_LIMIT }}
          CODE_TURNS: ${{ vars.CODE_TURNS }}
          CODE_REQUESTS: ${{ vars.CODE_REQUESTS }}
          PLAN: ${{ vars.PLAN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          AI_FALLBACK: ${{ vars.AI_FALLBACK }}
          OUTPUT_KEEP: ${{ vars.OUTPUT_KEEP }}
          AI_KEY_AI1: ${{ secrets.AI_KEY_AI1 }}
          AI_KEY_AI2: ${{ secrets.AI_KEY_AI2 }}
          AI_KEY_AI3: ${{ secrets.AI_KEY_AI3 }}
          AI_KEY_AI4: ${{ secrets.AI_KEY_AI4 }}
          AI_KEY_AI5: ${{ secrets.AI_KEY_AI5 }}
          AI_KEY_AI6: ${{ secrets.AI_KEY_AI6 }}
          AI_KEY_AI7: ${{ secrets.AI_KEY_AI7 }}
          AI_KEY_AI8: ${{ secrets.AI_KEY_AI8 }}
          AI: ${{ inputs.ai }}
          JOB: ${{ inputs.job }}
          MODE: ${{ inputs.mode }}
          PROMPT: ${{ inputs.prompt }}
          DURATION: ${{ inputs.duration }}
          SIZE: ${{ inputs.size }}
          REVIEW: ${{ inputs.review }}
          SPEED: ${{ inputs.speed }}
          STORYBOARD: ${{ inputs.storyboard || 'off' }}
          FILES: ${{ inputs.files }}
          RATING: ${{ inputs.rating }}
          FORMATS: ${{ inputs.formats }}
          MEDIA_DIR: ${{ inputs.media_dir }}
          LEVEL: ${{ inputs.level }}
          AUDIO: ${{ inputs.audio }}
          SOUND: ${{ inputs.sound }}
          DESIGN_ID: ${{ inputs.design_id }}
          PROJECT: ${{ inputs.project }}
          QUALITY: ${{ inputs.quality }}
          PARENT: ${{ inputs.parent }}
          RESUME: ${{ inputs.resume }}
          LONG_REQUESTS: ${{ vars.LONG_REQUESTS }}
          PROGRESS_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python run.py --mode "$MODE" --prompt "$PROMPT" --duration "$DURATION" --size "$SIZE" --review "$REVIEW" --files "$FILES" --rating "$RATING" --design-id "$DESIGN_ID" --formats "$FORMATS" --media-dir "$MEDIA_DIR" --level "$LEVEL" --audio "$AUDIO" --sound "$SOUND"

      - name: Save what the bot learned (memory) back to the repository
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/commit_memory.sh

      - name: Summary
        if: always()
        run: |
          for f in out/report.md out/learn_report.md out/feedback_report.md out/qa.md out/export_notes.md out/lighten_report.md out/design_matches.md out/compare_report.md out/remix.md out/study_report.md out/evolve_report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo "" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Save the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
